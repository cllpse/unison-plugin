<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8">

    <!-- Figma's UI font. The plugin iframe has no access to the editor's own copy, so it is loaded like other plugins do
         (the manifest allows these two hosts). Variable weights, for Figma's 450 and 550. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&display=swap">

    <style>
      /* Figma UI3 look: Inter 11/16 at weight 450 (550 for strong text), Figma's code font stack, and Figma's injected
         theme colors (themeColors: true), so light and dark follow the editor. */
      :root {
        --font-family: Inter, Helvetica, sans-serif;
        --font-mono: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        /* Figma's UI3 sizes: 11/16 body text (the code too, like Dev Mode's), the 4px spacing grid, 24px icon buttons
           holding 16px icons, 40px section headers, and its radii: 2px for tags, 5px for buttons. */
        --font-size: 11px;
        --line-height: 16px;
        --spacing-4: 4px;
        --spacing-8: 8px;
        --spacing-12: 12px;
        --spacing-16: 16px;
        --size-icon: 16px;
        --size-control: 24px;
        --size-section: 40px;
        --radius-small: 2px;
        --radius-medium: 5px;
      }

      *, ::before, ::after {
        box-sizing: border-box;
        user-select: none;
      }

      html {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        margin: 0;
        /* The window is a fixed frame: every scrollable region is a child, so the
           page itself never grows a scrollbar of its own. */
        overflow: hidden;
        font-family: var(--font-family);
        font-size: var(--font-size);
        font-weight: 450;
        line-height: var(--line-height);
        letter-spacing: 0.005em;
        color: var(--figma-color-text);
        background-color: var(--figma-color-bg);
        -webkit-font-smoothing: antialiased;
      }

      header {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        /* A section header, like those in Figma's properties panel: 16px in for the text, 8px for the buttons, which lines
           them up with the toolbar's. */
        height: var(--size-section);
        padding: 0 var(--spacing-8) 0 var(--spacing-16);
        gap: var(--spacing-8);
        background-color: var(--figma-color-bg);
        border-bottom: 1px solid var(--figma-color-border);
      }

      label {
        cursor: default;
      }

      /* The output pane: the code, with the toolbar floating over its top-right corner. */
      .output {
        position: relative;
        display: flex;
        flex: 1 1 50%;
        min-height: 0;
      }

      textarea {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        margin: 0;
        border: none;
        outline: none;
        padding: var(--spacing-8);
        resize: none;
        font-family: var(--font-mono);
        font-size: var(--font-size);
        line-height: var(--line-height);
        letter-spacing: 0;
        color: var(--figma-color-text);
        background-color: var(--figma-color-bg-secondary);
        user-select: text;
        border-bottom: 1px solid var(--figma-color-border);
        white-space: nowrap;
        scrollbar-gutter: stable;
      }

      /* :where keeps this base at zero specificity, so the toolbar group's own fill and hover override it. */
      :where(button, label.icon-button) {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--size-control);
        height: var(--size-control);
        padding: 0;
        border: 1px solid transparent;
        border-radius: var(--radius-medium);
        outline: none;
        appearance: none;
        background-color: transparent;
        color: var(--figma-color-icon);
        cursor: default;

        &:not(:disabled):hover {
          background-color: var(--figma-color-bg-hover);
        }

        &:not(:disabled):active {
          background-color: var(--figma-color-bg-pressed);
        }

        &:focus-visible {
          border-color: var(--figma-color-border-selected);
        }

        /* A toggle button, like the ones in Figma's sidebar: selected blue while on. */
        &[aria-pressed="true"] {
          background-color: var(--figma-color-bg-selected);
          color: var(--figma-color-icon-brand);

          &:hover {
            background-color: var(--figma-color-bg-selected-hover);
          }

          &:active {
            background-color: var(--figma-color-bg-selected-pressed);
          }
        }

        &:disabled {
          color: var(--figma-color-icon-disabled);
        }

        svg {
          display: block;
          width: var(--size-icon);
          height: var(--size-icon);
          pointer-events: none;
        }
      }

      /* The toolbar floats 8px in from the output's top-right corner. It is a
         segmented group like the rotate and flip buttons in Figma's sidebar: each button has its own grey fill and a 1px
         transparent line separates them. The fill is one step darker than Figma's (tertiary, not secondary) because the
         code pane under it is already secondary grey. */
      menu {
        position: absolute;
        top: var(--spacing-8);
        right: var(--spacing-8);
        display: flex;
        flex-direction: row;
        gap: 1px;
        margin: 0;
        padding: 0;

        button {
          border-radius: 0;
          background-color: var(--figma-color-bg-tertiary);
        }

        button:first-child {
          border-radius: var(--radius-medium) 0 0 var(--radius-medium);
        }

        button:last-child {
          border-radius: 0 var(--radius-medium) var(--radius-medium) 0;
        }

        /* Hover and press both go exactly one shade past the fill, toward the text color so it works in light and dark. */
        button:not(:disabled):hover,
        button:not(:disabled):active {
          background-color: color-mix(in srgb, var(--figma-color-bg-tertiary), var(--figma-color-text) 8%);
        }
      }

      /* Import sits before the "Show output" toggle, 8px apart on Figma's 4px grid. */
      .header-actions {
        display: flex;
        align-items: center;
        gap: var(--spacing-8);
      }

      /* The import icon is a label for the file input, so a click opens the file picker natively. The input stays in
         the layout (not display: none) so every browser lets the label open it. */
      #import-file {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      #issues {
        display: flex;
        flex-direction: column;
        flex: 0 1 auto;
        min-height: 0;
        max-height: 50%;
        overflow: hidden auto;
        padding: var(--spacing-12) var(--spacing-8);
        gap: var(--spacing-4);
        scrollbar-gutter: stable;
      }

      /* Section title, 12px above its first row (8px here plus the list's 4px gap), so the rows start 40px down, under
         a header as tall as Figma's. */
      .title {
        margin-bottom: var(--spacing-8);
        font-weight: 550;
      }

      /* The top bar's label: body text, muted, on one line. */
      #hint {
        color: var(--figma-color-text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* With the output pane hidden the issues list is the only flexible child,
         so it takes the whole frame. */
      body.output-hidden .output {
        display: none;
      }

      body.output-hidden #issues {
        flex: 1 1 auto;
        max-height: none;
      }

      /* Scrollbars are overlay-ish: the gutter is reserved (scrollbar-gutter on the textarea and the issues) so revealing a
         thumb never reflows the content, but track and thumb stay transparent unless the region is being scrolled. */
      textarea::-webkit-scrollbar,
      #issues::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      textarea::-webkit-scrollbar-track,
      textarea::-webkit-scrollbar-corner,
      #issues::-webkit-scrollbar-track,
      #issues::-webkit-scrollbar-corner {
        background-color: transparent;
      }

      textarea::-webkit-scrollbar-thumb,
      #issues::-webkit-scrollbar-thumb {
        /* A 4px pill, inset from the edges by the transparent border. */
        border: 3px solid transparent;
        border-radius: 999px;
        background-color: transparent;
        background-clip: padding-box;
        transition: background-color 150ms ease-out;
      }

      textarea[data-scrolling]::-webkit-scrollbar-thumb,
      #issues[data-scrolling]::-webkit-scrollbar-thumb {
        background-color: var(--figma-color-text-tertiary);
      }

      textarea[data-scrolling]::-webkit-scrollbar-thumb:hover,
      textarea[data-scrolling]::-webkit-scrollbar-thumb:active,
      #issues[data-scrolling]::-webkit-scrollbar-thumb:hover,
      #issues[data-scrolling]::-webkit-scrollbar-thumb:active {
        background-color: var(--figma-color-text-secondary);
      }

      p {
        margin: 0;
      }

      .warning {
        color: var(--figma-color-text-warning-secondary);
      }

      .danger {
        color: var(--figma-color-text-danger);
      }

      /* The property an issue is about, set apart like a tag tinted with the line's own color, so it works in light and
         dark mode alike. */
      .property {
        /* Inline, so the row's hover underline runs through it. The vertical padding grows the tint from Inter's 1.21em
           content area to the full line height. */
        padding: calc((var(--line-height) - 1.21em) / 2) var(--spacing-4);
        border-radius: var(--radius-small);
        background-color: color-mix(in srgb, currentColor 8%, transparent);
      }

      .success {
        color: var(--figma-color-text-success);
      }

      .secondary {
        color: var(--figma-color-text-secondary);
      }

      /* An issue row: its layer's type icon, then the line, in the row's color. */
      .issue {
        display: flex;
        /* The icon stays beside the first line when an explanation adds a second. */
        align-items: flex-start;
        gap: var(--spacing-4);

        /* Each line only as wide as its text, so the hover underline stops where the line does. */
        .text {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
        }

        /* The row's own color, toned down so the issue itself leads. */
        .explanation {
          opacity: 0.7;
        }

        svg {
          flex-shrink: 0;
          width: var(--size-icon);
          height: var(--size-icon);
        }
      }

      /* Issues link to their layer. */
      #issues [data-id] {
        width: fit-content;
        cursor: pointer;

        /* Drawn as one line under the text rather than text-decoration, which skips the tag's padding; the icon stays
           clear of it. */
        &:hover .line {
          background: linear-gradient(currentColor, currentColor) 0 calc(100% - 2px) / 100% 1px no-repeat;
        }
      }
    </style>
  </head>

    <section id="issues">
      <p class="title">Issues</p>

      <p class="secondary">Nothing selected</p>
    </section>

    <script>
      const textarea = document.getElementById("textarea")
      const issues = document.getElementById("issues")
      const outputToggle = document.getElementById("output-toggle")
      const refresh = document.getElementById("refresh")
      const back = document.getElementById("back")
      const copy = document.getElementById("copy")
      const importFile = document.getElementById("import-file")
      const hintText = document.getElementById("hint")
      let hintTimeout

      // Mark a region while it is being scrolled; the mark is what fades its
      // scrollbar in, and it clears once scrolling has settled.
      const revealScrollbarWhileScrolling = (element) => {
        let timer = 0

        element.addEventListener("scroll", () => {
          element.dataset.scrolling = ""

          clearTimeout(timer)

          timer = setTimeout(() => {
            delete element.dataset.scrolling
          }, 600)
        }, { passive: true })
      }

      revealScrollbarWhileScrolling(textarea)
      revealScrollbarWhileScrolling(issues)

      // Every toolbar button confirms what it did here, briefly.
      const showHint = (text, duration = 1500) => {
        hintText.textContent = text

        clearTimeout(hintTimeout)

        hintTimeout = setTimeout(() => {
          hintText.textContent = ""
        }, duration)
      }

      // Hovering a button names it in the same place, in place of a native tooltip.
      for (const button of document.querySelectorAll("[aria-label]")) {
        button.addEventListener("mouseenter", () => {
          clearTimeout(hintTimeout)
          hintText.textContent = button.getAttribute("aria-label")
        })

        // A confirmation shown after a click stays until its own timeout.
        button.addEventListener("mouseleave", () => {
          if (hintText.textContent === button.getAttribute("aria-label")) hintText.textContent = ""
        })
      }

      copy.onclick = () => {
        const { selectionStart, selectionEnd } = textarea

        textarea.focus()
        textarea.select()
        document.execCommand("copy")
        textarea.setSelectionRange(selectionStart, selectionEnd)
        showHint("Copied component code")
      }

      const setLoading = () => {
        textarea.value = "Generating component code…"
      }

        document.body.classList.toggle("output-hidden", !isOutputShown())
        window.parent.postMessage({ pluginMessage: { type: "toggleOutput", showOutput: isOutputShown() } }, "*")
      }

      outputToggle.onclick = () => {
        outputToggle.setAttribute("aria-pressed", String(!isOutputShown()))
        setLoading()
        applyOutputVisibility()
      }

      const setNothingSelected = (nothingSelected) => {
        if (nothingSelected) textarea.value = "Select a frame to generate component code…"

      const FRAME_TYPES = new Set(["FRAME", "GROUP", "COMPONENT", "COMPONENT_SET", "INSTANCE", "SECTION"])

      const getLayerIcon = (layerType) => {
        if (layerType === "TEXT") return LAYER_ICONS.TEXT
        if (FRAME_TYPES.has(layerType)) return LAYER_ICONS.FRAME

        return LAYER_ICONS.VECTOR
      }

      // PADDING LEFT reads as "padding left".
      // The explanation, when there is one, goes on its own muted line under the issue.
      const renderIssue = (issue, severity) => {
        const value = issue.value === undefined ? "" : ` (${issue.value})`
        // A text layer is usually named after its content, so its name is quoted to read as text.
        const layer = issue.layerType === "TEXT" ? `"${issue.layer}"` : issue.layer
        const line = `<span class="line">${layer} <span class="property">${issue.property.toLowerCase()}</span> ${issue.problem}${value}</span>`
        const explanation = issue.explanation === undefined ? "" : `<span class="explanation">${issue.explanation}</span>`

        return `<p class="issue ${severity}" data-id="${issue.nodeId}">${getLayerIcon(issue.layerType)}<span class="text">${line}${explanation}</span></p>`
      }

      const renderIssues = (errors, warnings, notifications, nothingSelected = false) => {
        let html = `<p class="title">Issues</p>`

        if (nothingSelected) {
          html += `<p class="secondary">Nothing selected</p>`
        } else if (errors.length === 0 && warnings.length === 0 && notifications.length === 0) {
          html += `<p class="success">None found</p>`
        }

        for (const error of errors) {
          html += renderIssue(error, "danger")
        }

        for (const warning of warnings) {
          html += renderIssue(warning, "warning")
        }

        for (const notification of notifications) {
          html += renderIssue(notification, "secondary")
        }

        issues.innerHTML = html
      }

      setNothingSelected(true)

      refresh.onclick = () => {
        showHint("Regenerating component code…")
        setLoading()
        window.parent.postMessage({ pluginMessage: { type: "refresh" } }, "*")
      }

      importFile.onclick = () => {
        importFile.value = ""
      }

      // The plugin parses the text itself, to keep the file's variable order.
      importFile.onchange = async () => {
        const file = importFile.files[0]

        if (file === undefined) return

        showHint(`Importing ${file.name}…`, 60000)
        setLoading()
        window.parent.postMessage({ pluginMessage: { type: "import", tokens: await file.text() } }, "*")
      }

      back.onclick = () => {
        showHint("Selecting previous layer…")
        setLoading()
        window.parent.postMessage({ pluginMessage: { type: "back" } }, "*")
      }

      issues.onclick = (event) => {
        const id = event.target.closest("p[data-id]")?.dataset.id

        if (id === undefined) return

        setLoading()
        window.parent.postMessage({ pluginMessage: { selectNode: id } }, "*")
      }

      window.onmessage = (event) => {
        const { output, errors, warnings, notifications, loading, hint, empty } = event.data.pluginMessage

        if (hint !== undefined) {
          showHint(hint.text, hint.duration)

          return
        }

        if (loading) {
          setLoading()

          return
        }

        const nothingSelected = empty === true

        setNothingSelected(nothingSelected)

        if (nothingSelected) {
          renderIssues([], [], [], true)

          return
        }

        renderIssues(errors, warnings, notifications)
        textarea.value = output
      }
    </script>
  </body>
</html>

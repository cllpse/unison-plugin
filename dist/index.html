<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8">

    <style>
      :root {
        --font-family: system-ui, -apple-system, Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', sans-serif;
      }

      *, ::before, ::after {
        box-sizing: border-box;
        user-select: none;
      }

      html {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        margin: 0;
        /* The window is a fixed frame: every scrollable region is a child, so the
           page itself never grows a scrollbar of its own. */
        overflow: hidden;
        background-color: var(--figma-color-bg);
      }

      body, input[type="checkbox"]::after {
        font-family: var(--font-family);
        font-size: 12px;
        line-height: calc(12px * 1.5);
        color: var(--figma-color-text);
      }

      header {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        padding: 12px;
        gap: 4px;
        border: none;
        background-color: var(--figma-color-bg);
        border-bottom: 1px solid var(--figma-color-border);
      }

      fieldset {
        display: flex;
        flex-direction: row;
        align-items: center;
        flex-shrink: 0;
        gap: 4px;
        padding: 0;
        border: none;
      }

      input[type="checkbox"] {
        position: relative;
        appearance: none;
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border: 1px solid var(--figma-color-border);
        border-radius: 4px;
        background-color: var(--figma-color-bg-hover);
        cursor: pointer;
        flex-shrink: 0;
      }

      input[type="checkbox"]:checked::after {
        content: "✓";
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        font-family: var(--font-family);
        opacity: 0.9;
      }

      label {
        cursor: pointer;
      }

      /* The output pane: the code, with the toolbar floating over its top-right corner. */
      .output {
        position: relative;
        display: flex;
        flex: 1 1 50%;
        min-height: 0;
      }

      textarea {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        border: none;
        outline: none;
        padding: 12px;
        resize: none;
        font-family: monospace;
        font-size: inherit;
        line-height: inherit;
        background-color: var(--figma-color-bg-secondary);
        user-select: text;
        border-bottom: 1px solid var(--figma-color-border);
        white-space: nowrap;
      }

      /* Figma-style icon buttons (24px, 5px corners), floating over the output's top-right corner. */
      menu {
        display: flex;
        flex-direction: row;
        gap: 4px;
        margin: 0;
        padding: 0;
        position: absolute;
        top: 8px;
        right: 8px;
      }

      button,
      label.icon-button {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: none;
        border-radius: 5px;
        outline: none;
        appearance: none;
        background-color: transparent;
        color: var(--figma-color-icon-secondary);
        cursor: pointer;

        &:hover {
          background-color: var(--figma-color-bg-hover);
          color: var(--figma-color-icon);
        }

        svg {
          display: block;
          pointer-events: none;
        }
      }

      /* Groups: back, then refresh and copy. */
      #refresh {
        margin-left: 4px;
      }

      /* Import sits before "Show output", 8px apart. */
      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;

        /* The 24px icon overhangs the 18px text line instead of growing the header. On hover only the icon lightens; it
           gets no background. */
        #import {
          margin-block: -3px;
          color: var(--figma-color-icon);

          &:hover {
            background-color: transparent;
            color: var(--figma-color-icon-secondary);
          }
        }

        fieldset {
          margin: 0;
        }
      }

      /* The import icon is a label for the file input, so a click opens the file picker natively. The input stays in
         the layout (not display: none) so every browser lets the label open it. */
      #import-file {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      summary {
        display: flex;
        flex-direction: column;
        flex: 0 1 auto;
        min-height: 0;
        max-height: 50%;
        overflow: hidden auto;
        padding: 12px;
        gap: 4px;
      }

      /* With the output pane hidden the issues list is the only flexible child,
         so it takes the whole frame. */
      body.output-hidden .output {
        display: none;
      }

      body.output-hidden summary {
        flex: 1 1 auto;
        max-height: none;
      }

      /* Scrollbars are overlay-ish: the gutter is reserved so revealing a thumb
         never reflows the content, but track and thumb stay transparent until
         the region is actually scrolled (or pointed at). */
      textarea,
      summary {
        scrollbar-gutter: stable;
      }

      textarea::-webkit-scrollbar,
      summary::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      textarea::-webkit-scrollbar-track,
      textarea::-webkit-scrollbar-corner,
      summary::-webkit-scrollbar-track,
      summary::-webkit-scrollbar-corner {
        background-color: transparent;
      }

      textarea::-webkit-scrollbar-thumb,
      summary::-webkit-scrollbar-thumb {
        /* A 4px pill, inset from the edges by the transparent border. */
        border: 3px solid transparent;
        border-radius: 999px;
        background-color: transparent;
        background-clip: padding-box;
        transition: background-color 150ms ease-out;
      }

      textarea[data-scrolling]::-webkit-scrollbar-thumb,
      textarea:hover::-webkit-scrollbar-thumb,
      summary[data-scrolling]::-webkit-scrollbar-thumb,
      summary:hover::-webkit-scrollbar-thumb {
        background-color: var(--figma-color-text-tertiary);
      }

      textarea::-webkit-scrollbar-thumb:hover,
      textarea::-webkit-scrollbar-thumb:active,
      summary::-webkit-scrollbar-thumb:hover,
      summary::-webkit-scrollbar-thumb:active {
        background-color: var(--figma-color-text-secondary);
      }

      p, label, input[type="checkbox"]::after {
        display: inline;
        width: fit-content;
        margin: 0;
        font-size: inherit;
        font-family: inherit;
        line-height: inherit;
      }

      p:not(:first-child):not(:last-child) {
        margin-top: 2px;
        margin-bottom: 2px;
      }

      p.warning {
        color: var(--figma-color-text-brand);
      }

      p.danger {
        color: var(--figma-color-text-danger);
      }

      p.tertiary {
        color: var(--figma-color-text-tertiary);
      }

      p[data-id],
      p[data-id] {
        cursor: pointer;
      }

      p[data-id]:hover,
      p[data-id]:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <header>
      <p class="tertiary" id="copy-hint"></p>

      <div class="header-actions">
        <label id="import" class="icon-button" for="import-file" aria-label="Import tokens" title="Import tokens as variables and styles">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5 17.63 8.75v6.5L12 18.5l-5.63-3.25v-6.5z" /><path d="M12 9v5M9.75 12 12 14.25 14.25 12" /></svg>
        </label>
        <input id="import-file" type="file" accept=".json,application/json" tabindex="-1" />
        <fieldset>
          <input type="checkbox" id="checkbox" checked>
          <label for="checkbox">Show output</label>
        </fieldset>
      </div>
    </header>

    <div class="output">
      <textarea id="textarea" spellcheck="false"></textarea>

      <menu>
        <button id="back" type="button" title="Go back to previous layer">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 12H7M11 8l-4 4 4 4" /></svg>
        </button>
        <button id="refresh" type="button" title="Re-generate output">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.95 10.5A5 5 0 1 0 17 13" /><path d="M17 6.5v4h-4" /></svg>
        </button>
        <button id="copy" type="button" title="Copy output to clipboard">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9.5" y="9.5" width="8" height="8" rx="1.5" /><path d="M14.5 9.5V8A1.5 1.5 0 0 0 13 6.5H8A1.5 1.5 0 0 0 6.5 8v5A1.5 1.5 0 0 0 8 14.5h1.5" /></svg>
        </button>
      </menu>
    </div>

    <summary>
      <p><strong>Issues</strong></p>

      <p class="tertiary">None found</p>
    </summary>

    <script src="placeholder.js"></script>

    <script>
      const textarea = document.getElementById("textarea")
      const summary = document.querySelector("summary")
      const checkbox = document.getElementById("checkbox")
      const refresh = document.getElementById("refresh")
      const back = document.getElementById("back")
      const copy = document.getElementById("copy")
      const importFile = document.getElementById("import-file")
      const copyHint = document.getElementById("copy-hint")
      let copyHintTimeout

      // Mark a region while it is being scrolled; the mark is what fades its
      // scrollbar in, and it clears once scrolling has settled.
      const revealScrollbarWhileScrolling = (el) => {
        let timer = 0

        el.addEventListener("scroll", () => {
          el.dataset.scrolling = ""

          clearTimeout(timer)

          timer = setTimeout(() => {
            delete el.dataset.scrolling
          }, 600)
        }, { passive: true })
      }

      revealScrollbarWhileScrolling(textarea)
      revealScrollbarWhileScrolling(summary)

      // Every toolbar button confirms what it did here, briefly.
      const showHint = (text, duration = 1500) => {
        copyHint.textContent = text
        clearTimeout(copyHintTimeout)
        copyHintTimeout = setTimeout(() => {
          copyHint.textContent = ""
        }, duration)
      }

      const copyOutput = () => {
        const { selectionStart, selectionEnd } = textarea

        textarea.focus()
        textarea.select()
        document.execCommand("copy")
        textarea.setSelectionRange(selectionStart, selectionEnd)
        showHint("Copied to clipboard")
      }

      copy.onclick = copyOutput

      const setLoading = () => {
        textarea.value = "Loading…"
      }

      const applyOutputVisibility = () => {
        document.body.classList.toggle("output-hidden", !checkbox.checked)
        window.parent.postMessage({ pluginMessage: { type: "toggleOutput", showOutput: checkbox.checked } }, "*")
      }

      checkbox.onchange = () => {
        setLoading()
        applyOutputVisibility()
      }

      applyOutputVisibility()

      textarea.value = window.placeholder

      refresh.onclick = () => {
        showHint("Refreshing…")
        setLoading()
        window.parent.postMessage({ pluginMessage: { type: "refresh" } }, "*")
      }

      importFile.onclick = () => {
        importFile.value = ""
      }

      // The plugin parses the text itself, to keep the file's variable order.
      importFile.onchange = async () => {
        const file = importFile.files[0]

        if (!file) return

        showHint(`Importing ${file.name}…`, 60000)
        setLoading()
        window.parent.postMessage({ pluginMessage: { type: "import", tokens: await file.text() } }, "*")
      }

      back.onclick = () => {
        showHint("Going back…")
        setLoading()
        window.parent.postMessage({ pluginMessage: { type: "back" } }, "*")
      }

      summary.onclick = (e) => {
        const id = e.target.closest("p[data-id]")?.dataset.id

        if (!id) return

        setLoading()
        window.parent.postMessage({ pluginMessage: { selectNode: id } }, "*")
      }

      window.onmessage = (event) => {
        const { output, warnings, errors, loading, hint } = event.data.pluginMessage

        if (hint) {
          showHint(hint.text, hint.duration)

          return
        }

        if (loading) {
          textarea.value = "Loading…"

          return
        }

        let html = `<p><strong>Issues</strong></p>`

        if (warnings.length === 0 && errors.length === 0) {
          html += `<p class="tertiary">None found</p>`
        }

        for (const e of errors) {
          html += `<p class="danger" data-id="${e.nodeId}">${e.message}</p>`
        }

        for (const w of warnings) {
          html += `<p class="warning" data-id="${w.nodeId}">${w.message}</p>`
        }

        summary.innerHTML = html
        textarea.value = output
      }
    </script>
  </body>
</html>
